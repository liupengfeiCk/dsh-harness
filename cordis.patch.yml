# The dsh-harness-hot-bundle patch: mounts the Harness-owned hot mount/upgrade
# surface as a host row. The `harnessHot` service provides mount/unmount/upgrade/
# list over a loopback-pinned `/harness-hot` RPC channel; the `/harness-hot`
# wire row rides alongside the `connection` service it registers through.
#
# A later layer (the profile's own cordis.patch.yml or a --patch overlay) wins
# per row. This row uses a distinct id (`harness-hot`) from any official row
# (the Loader rejects duplicate ids), so it cannot collide with a later layer
# that re-enables the official row.

- insert:
    # The harnessHot service + `/harness-hot` loopback RPC channel. A host row.
    - id: harness-hot
      name: 'dsh-harness-hot-bundle'
