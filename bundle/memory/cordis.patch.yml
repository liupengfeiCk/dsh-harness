# The dsh-harness-memory-bundle patch: mounts the Harness-owned memory subsystem
# as host rows.
#
# T2 skeleton 阶段挂载已就位的部分：
#   - `tasks`：task-entity registry（设计 §7 F10）—— `Tasks` host service
#     (src/tasks/index.ts)，L0/L1 记忆按任务过滤的维度注册表。
#   - `memory-task-wire`：`/memory-task` loopback RPC 通道（src/tasks/wire），
#     仿 model-plan 的 `/model-plan` wire，承载 task list/read/create/update/
#     complete/attachSession。
#   - `memory-task-tool`：主代理 `create_task` 工具（src/tasks/tool），注册进
#     tools 服务。
#
# 记忆引擎本体（T3 HostAdapter/LLMRunner + vendor TdaiCore 装配）作为 host 行
# `memory`（name: 'dsh-harness-memory-bundle'）在本骨架的 src/index.ts 预留，
# 由 T3/T4 填充并挂载。
#
# A later layer (the profile's own cordis.patch.yml or a --patch overlay) wins
# per row. These rows use distinct ids (`tasks`/`memory-task-wire`/
# `memory-task-tool`) from any official row (the Loader rejects duplicate ids).

- insert:
    # The task-entity registry: the durable task table + association ledger,
    # mounted as `ctx.get('tasks')`. A host row.
    - id: tasks
      name: 'dsh-harness-memory-bundle/tasks'

    # The task-management wire: the `/memory-task` loopback RPC channel over
    # the connection's dedicated generic RPC. Rides alongside the `tasks`
    # service. Loopback-pinned (managing tasks is privileged).
    - id: memory-task-wire
      name: 'dsh-harness-memory-bundle/tasks/wire'

    # The main-agent `create_task` tool: registers into the `tools` service.
    # The tool resolves the `tasks` service opportunistically via ctx.get.
    - id: memory-task-tool
      name: 'dsh-harness-memory-bundle/tasks/tool'

    # T10 工具回查与补召：查记忆（query_memory）与查原对话（query_conversation，
    # 含补召细层摘要 + L0 原文）。组合行共享一个每会话 ≤ 3 次的限次预算。
    # 工具通过 ctx.get('memory') 机会式解析记忆引擎。
    - id: memory-tools
      name: 'dsh-harness-memory-bundle/tools'

    # The memory engine host service: assembles the vendor TdaiCore behind the
    # bundle's host adapter (data dir `~/.dsh/memory`, ctx.logger, ctx.llm LLM
    # runner). A host row. Its `start()` initializes the engine on boot.
    #
    # `inject` on the `llm` service keeps cordis from activating this row until
    # the LLM runtime is injected, so `TdaiCore.wirePipelineRunners` (which
    # builds the standalone LLM runner off `ctx.llm`) is not reached before the
    # LLM service is ready — a cold-boot ordering fix for the extraction path.
    - id: memory
      name: 'dsh-harness-memory-bundle'
      inject:
        llm:
          required: true
